# Configuração do analisador estático. Corre localmente com `flutter analyze` e
# no CI, onde os `info` também travam o build — ver .github/workflows/ci.yml.
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # No flutter_lints base isto é apenas `info`, e um `print` esquecido passava
    # despercebido. A app usa `debugPrint`, que é filtrado em release.
    avoid_print: error

linter:
  rules:
    # Aspas simples, como a esmagadora maioria do código já faz.
    prefer_single_quotes: true
    # Usar o BuildContext depois de um `await` sem verificar `mounted` foi a
    # origem de vários erros neste projeto.
    use_build_context_synchronously: true
    # `const` onde é possível: estes ecrãs reconstroem muito, e em listas
    # longas cada widget não-const é reconstruído por nada.
    prefer_const_constructors: true
    prefer_const_declarations: true

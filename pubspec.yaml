name: gestao_producao_fabrica
description: "Aplicação de gestão de produção industrial com rastreabilidade por ordem de fabrico."
publish_to: 'none'

# Sobe a cada entrega: o número de build é o que distingue instalações no chão
# de fábrica quando é preciso saber que versão está num terminal.
version: 1.1.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Relógio injetável: o teto de rajada do RecarregadorDebounced mede tempo real
  # e sem isto não é verificável com um relógio virtual nos testes.
  clock: any
  supabase_flutter: ^2.16.0
  pdf: ^3.13.0
  printing: ^5.15.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Relógio virtual para os testes do RecarregadorDebounced. Sem versão: já vem
  # com o flutter_test e fixá-la aqui só criaria conflitos a cada upgrade.
  fake_async: any

flutter:
  uses-material-design: true
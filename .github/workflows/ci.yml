name: CI

# Corre em cada push e em cada pull request para main: é o travão que garante
# que nada entra no ramo principal sem `flutter analyze` e `flutter test` verdes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Botão "Run workflow" no separador Actions: gera uma APK nova sem ser
  # preciso fazer push.
  workflow_dispatch:

jobs:
  analise-e-testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versão fixa, igual à do ambiente local. Com `channel: stable` sem versão,
      # cada nova stable traz pacotes do SDK (meta, matcher, test_api…) noutras
      # versões e o `--enforce-lockfile` falha. Ao atualizar o Flutter local,
      # atualizar também aqui e no job apk-android.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Instalar dependências (com as versões do pubspec.lock)
        run: flutter pub get --enforce-lockfile

      # Sem exceções: o projeto está a zero problemas, incluindo os `info`. As
      # regras ativas estão em analysis_options.yaml.
      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test

  # Compila a aplicação para Android. Corre nos servidores da GitHub, que já
  # trazem o SDK Android instalado: não é preciso o SDK em nenhuma máquina
  # nossa, e a compilação — que é lenta — não ocupa o portátil de ninguém.
  #
  # Depende da análise e dos testes: não vale a pena gastar minutos a compilar
  # código que já se sabe que não passa.
  apk-android:
    needs: analise-e-testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O Gradle do Android precisa de JDK 17. O runner traz várias versões
      # instaladas e a que está ativa por omissão nem sempre é esta.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Instalar dependências (com as versões do pubspec.lock)
        run: flutter pub get --enforce-lockfile

      # Build de debug e não de release: uma APK de release tem de ser assinada
      # com uma chave criptográfica, que teria de ficar guardada nos secrets do
      # repositório. Para instalar e testar num telemóvel, a de debug serve —
      # é apenas maior e um pouco mais lenta.
      - name: Compilar APK
        run: flutter build apk --debug

      - name: Publicar a APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: gestao-producao-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          # Sem retenção infinita: cada execução gera uma APK e estas contam
          # para a quota de armazenamento do repositório.
          retention-days: 14
